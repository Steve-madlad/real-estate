services:
  nginx:
    image: ganerino69/nginx:alpine
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    develop: 
      watch: 
        - path: ./nginx/nginx.conf
          action: restart

  frontend:
    image: ganerino69/real-estate-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    # Uncomment when building the image locally so we don't get warnings from Docker about missing variables
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile.standalone
    #   args:
    #     NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    #     NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${NEXT_PUBLIC_COGNITO_USER_POOL_ID}
    #     NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID}
    #     NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
    #     NODE_VERSION: ${NODE_VERSION:-22.23}
    environment:
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    # ports:
    #   - "3000:3000"
    expose: 
     - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s 
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    develop: 
      watch: 
        - path: ./frontend
          action: rebuild
          ignore: 
            - node_modules
            - .next
            - .git
            - .dockerignore
        - path: ./frontend/Dockerfile.standalone
          action: rebuild
        - path: ./frontend/Dockerfile
          action: rebuild

  backend:
    image: ganerino69/real-estate-backend:${IMAGE_TAG:-latest}
    # Uncomment when building the image locally so we don't get warnings from Docker about missing variables
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    #   secrets: 
    #     - DATABASE_URL
    #   args:
    #     NODE_VERSION: ${NODE_VERSION:-22.23}
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    # ports:
    #   - "3001:3001"
    expose: 
     - "3001"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    develop: 
      watch: 
        - path: ./backend
          action: rebuild
          ignore: 
            - node_modules
            - .next
            - .git
            - .dockerignore
        - path: ./backend/Dockerfile
          action: rebuild
      

secrets: 
  DATABASE_URL: 
    environment: DATABASE_URL

