services:
  nginx:
    image: nginx:alpine
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "4001:80"
    depends_on:
      - frontend
      - backend
    develop: 
      watch: 
        - path: ./nginx/nginx.conf
          action: restart
  frontend:
    image: real-estate-frontend:latest
    depends_on:
      - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile.standalone
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${NEXT_PUBLIC_COGNITO_USER_POOL_ID}
        NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NODE_VERSION: ${NODE_VERSION:-22.23}
    environment:
      NODE_ENV: production
    # ports:
    #   - "3000:3000"
    expose: 
     - "3000"
    develop: 
      watch: 
        - path: ./frontend
          action: rebuild
          ignore: 
            - node_modules
            - .next
            - .git
            - .dockerignore
        - path: ./frontend/Dockerfile.standalone
          action: rebuild
        - path: ./frontend/Dockerfile
          action: rebuild

  backend:
    image: real-estate-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets: 
        - DATABASE_URL
      args:
        NODE_VERSION: ${NODE_VERSION:-22.23}
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    # ports:
    #   - "3001:3001"
    expose: 
     - "3001"
    develop: 
      watch: 
        - path: ./backend
          action: rebuild
          ignore: 
            - node_modules
            - .next
            - .git
            - .dockerignore
        - path: ./backend/Dockerfile
          action: rebuild
      

secrets: 
  DATABASE_URL: 
    environment: DATABASE_URL

